<div class="intro">
    <h3>Inventory Management</h3>
    <p>View, search and manage your saree stock.</p>
</div>

<!-- Search and Refresh -->
<div class="inventory-toolbar">
    <input
        type="search"
        id="inventorySearch"
        placeholder="Search product name or code..."
    >

    <button type="button" id="refreshInventory" class="primary">
        ↻ Refresh
    </button>
</div>

<!-- Inventory Filters -->
<div class="inventory-filters">
    <button type="button" class="inventory-filter active" data-filter="all">
        Total Products
        <span id="filterTotalCount">0</span>
    </button>

    <button type="button" class="inventory-filter" data-filter="stock">
        In Stock
        <span id="filterStockCount">0</span>
    </button>

    <button type="button" class="inventory-filter" data-filter="sold">
        Sold Out
        <span id="filterSoldCount">0</span>
    </button>

    <button type="button" id="exportInventory" class="export-button">
        ↓ Export CSV
    </button>
</div>

<!-- Product List -->
<div class="table-card">
    <div class="table-heading">
        <h3>Product List</h3>
        <span id="inventoryCount">0 products</span>
    </div>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Product</th>
                    <th>Unit Cost</th>
                    <th>Selling</th>
                    <th>Profit / Unit</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="inventoryTableBody">
                <tr>
                    <td colspan="7" class="empty-state">
                        Loading inventory...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<p id="inventoryMessage" class="inventory-message"></p>
