<div class="opex-page" id="opexPage">

    <div class="intro">
        <h3>Operating Expenses</h3>
        <p>Record and review your saree business expenses.</p>
    </div>

    <div class="opex-summary">
        <div class="stat">
            <small>Total Expenses</small>
            <strong id="opexTotal">₹0</strong>
        </div>
        <div class="stat">
            <small>Total Salary</small>
            <strong id="opexTotalSalary">₹0</strong>
        </div>
        <div class="stat">
            <small>Expense Records</small>
            <strong id="opexCount">0</strong>
        </div>
    </div>

    <form id="opexForm" class="form-card">

        <div class="form-section">
            <h3 id="opexFormHeading">Add Expense</h3>

            <div class="form-grid">

                <label>
                    Category
                    <select id="opexCategory" required>
                        <option value="Courier">Courier</option>
                        <option value="Packaging">Packaging</option>
                        <option value="Pickup">Pickup</option>
                        <option value="Shipping">Shipping</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>
                </label>

                <label id="salaryStaffField" class="hidden">
                    Staff Name
                    <select id="salaryStaff">
                        <option value="">Select Staff</option>
                        <option value="Jaya">Jaya</option>
                        <option value="Balu">Balu</option>
                        <option value="Contribution">Contribution</option>
                        <option value="Other">Other</option>
                    </select>
                </label>

                <label>
                    Amount (₹)
                    <input id="opexAmount" type="number"
                        min="0.01" step="0.01" required>
                </label>

                <label class="full">
                    Description
                    <input id="opexDescription" type="text"
                        required placeholder="Enter expense details">
                </label>

                <label>
                    Expense Date
                    <input id="opexDate" type="date" required>
                </label>

            </div>
        </div>

        <div class="form-actions">
            <button type="submit" id="saveOpexBtn" class="primary">
                Save Expense
            </button>
            <button type="button" id="cancelOpexEdit" class="secondary hidden">
                Cancel Edit
            </button>
        </div>

        <p id="opexMessage" class="form-message"></p>

    </form>

    <div class="table-card opex-history">

        <div class="table-heading">
            <h3>Expense History</h3>
            <span id="opexHistoryCount">0 records</span>
        </div>

        <div class="table-wrap">
            <table class="data-table">

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="opexTableBody">
                    <tr>
                        <td colspan="5" class="empty-state">
                            Loading expenses...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>
