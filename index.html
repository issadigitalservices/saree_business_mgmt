<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Aarabhi Online Threads</title>

    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <link rel="stylesheet" href="assets/css/pages/common.css">

    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>

<body>

    <!-- INSTANT SESSION CHECK TO PREVENT REFRESH FLASH -->
    <script>
        (function() {
            // Check if any Firebase auth session exists in local storage
            const hasCachedSession = Object.keys(localStorage).some(key => key.startsWith('firebase:authUser:'));
            if (hasCachedSession) {
                // Inject a temporary style to keep #app visible and #login hidden instantly on load
                const style = document.createElement('style');
                style.innerHTML = '#login { display: none !important; } #app { display: flex !important; }';
                document.head.appendChild(style);
            }
        })();
    </script>

    <!-- LOGIN -->

    <div id="login" class="login">

        <form id="loginForm" class="login-card">

            <img
                src="assets/images/logo.png"
                alt="Aarabhi Online Threads Logo"
                class="brand-logo login-logo"
            >

            <h1>Aarabhi Online Threads</h1>
            <p>Inventory &amp; Sales Management</p>

            <label>
                Email
                <input id="email" type="email" required>
            </label>

            <label>
                Password
                <input id="password" type="password" required>
            </label>

            
<button class="primary" type="submit">
    Sign in
</button>

<p id="loginMsg" class="error"></p>

<p style="text-align:center;margin-top:15px;">
    Don't have an account?
    <button type="button"
            id="showRegister"
            style="background:none;border:none;color:#117f78;
                   font-weight:700;cursor:pointer;">
        Create New Account
    </button>
</p>


        </form>

    </div>


<!-- NEW USER REGISTRATION -->

<div id="register" class="login hidden">

    <form id="registerForm" class="login-card">

        <img src="assets/images/logo.png"
             alt="Aarabhi Online Threads"
             class="brand-logo login-logo">

        <h1>Create New Account</h1>
        <p>Aarabhi Online Threads</p>

        <label>
            Full Name
            <input id="registerName"
                   type="text"
                   autocomplete="name"
                   required>
        </label>

        <label>
            Email Address
            <input id="registerEmail"
                   type="email"
                   autocomplete="email"
                   required>
        </label>

        <label>
            Password
            <input id="registerPassword"
                   type="password"
                   minlength="8"
                   autocomplete="new-password"
                   required>
        </label>

        <label>
            Confirm Password
            <input id="registerConfirmPassword"
                   type="password"
                   minlength="8"
                   autocomplete="new-password"
                   required>
        </label>

        <button type="submit"
                id="registerSubmit"
                class="primary">
            Create Account
        </button>

        <p id="registerMsg"
           aria-live="polite"
           style="text-align:center;"></p>

        <p style="text-align:center;margin-top:15px;">
            Already have an account?
            <button type="button"
                    id="backToLogin"
                    style="background:none;border:none;
                           color:#117f78;font-weight:700;
                           cursor:pointer;">
                Sign in
            </button>
        </p>

    </form>

</div>


    <!-- APPLICATION -->

    <div id="app" class="app hidden">

        <aside>

            <div class="brand">
                <img
                    src="assets/images/logo.png"
                    alt="Aarabhi Online Threads"
                    class="brand-logo sidebar-logo"
                >
                <b>Aarabhi Online Threads</b>
            </div>

            <nav id="nav">

                <button type="button" data-page="home">⌂ Dashboard</button>

                <button type="button" data-page="add">＋ Add Item</button>

                <button type="button" data-page="inventory">▦ Inventory</button>

                <button type="button" data-page="sales">↗ Sales</button>

                <button type="button" data-page="viewsales">▣ View Sales</button>

                <button type="button" data-page="reports" data-admin-only>
                    ▤ Reports
                </button>

                <button type="button" data-page="opex" data-admin-only>
                    ₹ OPEX
                </button>

                <button type="button" data-page="staff" id="staffNav" data-admin-only>
                    ♙ Staff
                </button>

            </nav>

            <div class="bottom">
                <small id="userEmail"></small>
                <button id="logout" class="link" type="button">Sign out</button>
            </div>

        </aside>

        <main>

            <header>
                <div>
                    <small>AARABHI ONLINE THREADS</small>
                    <h2 id="heading">Dashboard</h2>
                </div>

                <span id="role" class="pill"></span>
            </header>

            <section id="screen"></section>

            <button id="homeBottom" class="home-bottom" type="button">
                ⌂ Home
            </button>

        </main>

    </div>

    <div id="toast"></div>

    <script type="module" src="assets/js/core/app.js"></script>

</body>
</html>
